plugins {
	id 'fabric-loom'
	id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
	maven { url = 'https://maven.fabricmc.net/' }
	maven { url = 'https://maven.quiltmc.org/repository/release' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API (optional but recommended)
	// NOTE: MCSR Ranked setup does NOT require Fabric API
	// Uncomment only if absolutely necessary for your features
	// modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// JSON parsing
	implementation 'com.google.code.gson:gson:2.8.9'

	// HTTP client for GapCheck
	implementation 'com.squareup.okhttp3:okhttp:4.9.3'
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version

	filtersDir "${project.projectDir}/src/main/resources/templates"
	filter ReplaceTokens, tokens: [
		"version"         : project.version.toString(),
		"minecraft_version": project.minecraft_version,
		"loader_version"  : project.loader_version
	]

	from(sourceSets.main.resources.srcDirs) {
		include "fabric.mod.json"
	}

	from(sourceSets.main.resources.srcDirs) {
		exclude "fabric.mod.json"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 8
}

java {
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename it, "LICENSE_${archives_base_name}"
	}
}

publishingPublications {
	mavenJava(MavenPublication) {
		from components.java
	}
}

publishingRepositories {
}
